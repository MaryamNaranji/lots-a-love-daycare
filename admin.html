
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Daycare Admin | Lots A Love Daycare</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://rbcnqropwclaloeaurxt.supabase.co";
  const SUPABASE_KEY = "sb_publishable_L5Gy0rYzivcSma-ob4Jy2w_UfgiGC5X";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>
</head>
<body>
  <main class="container">
    <h1>Lots A Love Daycare</h1>
    <h2>Administrator Dashboard</h2>
   <section id="admin-login">
  <h3>Administrator Sign In</h3>
  <p>Authorized daycare administrators only.</p>

  <form id="login-form">
    <label for="admin-email">Email Address</label>
    <input
      type="email"
      id="admin-email"
      autocomplete="username"
      required
    >

    <label for="admin-password">Password</label>
    <input
      type="password"
      id="admin-password"
      autocomplete="current-password"
      required
    >

    <button type="submit">Sign In</button>
  </form>

  <p id="login-message" role="status" aria-live="polite"></p>
</section>
    <section id="admin-dashboard" hidden>
  <h3>Gallery Management</h3>
  <p>Welcome to the Lots A Love Daycare administration dashboard.</p>

  <h4>Upload Photos and Videos</h4>
  <p>Manage the daycare website gallery from this secure area.</p>

  <div id="gallery-management">
  <form id="gallery-upload-form">
    <p>
      <label for="gallery-file">Choose a photo or video</label>
      <input
        type="file"
        id="gallery-file"
        accept="image/jpeg,image/png,image/webp,video/mp4,video/webm"
        required
      >
    </p>

    <p>
      <label for="gallery-title">Title</label>
      <input
        type="text"
        id="gallery-title"
        placeholder="Example: Arts and Crafts Day"
        maxlength="100"
        required
      >
    </p>

    <p>
      <label for="gallery-description">Description</label>
      <textarea
        id="gallery-description"
        placeholder="Describe this activity"
        rows="3"
      ></textarea>
    </p>

    <p>
      <label>
        <input type="checkbox" id="gallery-published">
        Publish on the daycare website
      </label>
    </p>

    <button type="submit" id="gallery-upload-button">
      Upload to Gallery
    </button>

    <p id="gallery-upload-message" role="status"></p>
  </form>
</div>

  <button type="button" id="admin-logout">
    Sign Out
  </button>
</section>
    <p>
      <a href="/">Return to homepage</a>
    </p>
  </main>
  <script>
  const loginForm = document.getElementById("login-form");
  const loginMessage = document.getElementById("login-message");

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("admin-email").value.trim();
    const password = document.getElementById("admin-password").value;

    loginMessage.textContent = "Signing in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      loginMessage.textContent = "Sign in failed. Please check your credentials.";
      return;
    }

    const { data: adminRecord, error: adminError } =
      await supabaseClient
        .from("daycare_admins")
        .select("user_id")
        .eq("user_id", data.user.id)
        .maybeSingle();

    if (adminError || !adminRecord) {
      await supabaseClient.auth.signOut();
      loginMessage.textContent = "This account is not authorized as a daycare administrator.";
      return;
    }

    loginMessage.textContent = "Administrator sign-in successful!";
    document.getElementById("admin-login").hidden = true;
document.getElementById("admin-dashboard").hidden = false;
  });
</script>
</body>
</html>
